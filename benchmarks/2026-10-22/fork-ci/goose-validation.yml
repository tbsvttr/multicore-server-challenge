name: Goose x86-64 validation

on:
  push:
    branches: [validation/goose-native-2026-10-22]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goose:
    name: Goose source build and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - name: Record validation host and source
        run: |
          uname -a
          test "$(uname -m)" = x86_64
          nproc
          free -m
          git rev-parse HEAD
          git ls-tree -r HEAD submissions/goose-native-tbsvttr
      - name: Install harness tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client curl jq
      - name: Generate original dev seed
        run: bash seed/make-seed.sh --dev
      - name: Install submission dependencies
        run: sudo bash submissions/goose-native-tbsvttr/install.sh
      - name: Original dev conformance with default settings
        run: bash test/run.sh submissions/goose-native-tbsvttr
      - name: Native primitive and Goose FFI checks
        run: bash submissions/goose-native-tbsvttr/tests/native.sh
      - name: Generate original full seed
        run: bash seed/make-seed.sh
      - name: Original full-seed conformance with live article batching
        env:
          TEMPLATE: conduit_seed
          ARTICLE_BATCH: 1
        run: bash test/run.sh submissions/goose-native-tbsvttr
